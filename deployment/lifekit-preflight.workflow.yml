# LOCAL TEMPLATE ONLY. Not installed or dispatched.
# Intended repository: Erste-Hilfe-Hero/lifekit-ki-site
# Uses existing repository secrets; never copies their values to Dranbleib.
name: Dranbleib separate Contabo preflight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dranbleib-contabo
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONTABO_CLIENT_ID: ${{ secrets.CONTABO_CLIENT_ID }}
      CONTABO_CLIENT_SECRET: ${{ secrets.CONTABO_CLIENT_SECRET }}
      CONTABO_API_USER: ${{ secrets.CONTABO_API_USER }}
      CONTABO_API_PASSWORD: ${{ secrets.CONTABO_API_PASSWORD }}
    steps:
      - name: Read existing access helper at the inspected revision
        uses: actions/checkout@v4
        with:
          repository: Erste-Hilfe-Hero/lifekit-ki-site
          ref: 5a1f0cdd60e06b4f41ad5545030bcaaa0ed8c147
          path: access-source
          sparse-checkout: tools/deploy/contabo-web-access.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Checkout public Dranbleib source
        uses: actions/checkout@v4
        with:
          repository: Erste-Hilfe-Hero/Dranbleib
          path: project
          # Before installation, replace with the reviewed commit containing the probe.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect the existing Contabo host without changing applications
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/nyr-web "$HOME/.ssh"
          node access-source/tools/deploy/contabo-web-access.mjs
          VPS_HOST=$(cat /tmp/nyr-web/ip)
          ssh-keyscan -H "$VPS_HOST" > "$RUNNER_TEMP/dranbleib-known-hosts" 2>/dev/null
          # Uses the same existing SSH trust-bootstrap method as LifeKit.
          # Inventory executes from stdin: no project/server files are installed.
          ssh -i /tmp/nyr-web/key -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/dranbleib-known-hosts" -o ConnectTimeout=20 "root@$VPS_HOST" 'python3 -' < project/deployment/contabo-preflight.py > "$RUNNER_TEMP/dranbleib-preflight.json"
          python -m json.tool "$RUNNER_TEMP/dranbleib-preflight.json"
      - name: Verify the closed public preview and review media without credentials
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://161.97.102.171:8443/health
          curl --fail --silent --show-error https://161.97.102.171:8443/.well-known/oauth-protected-resource/mcp
          curl --fail --silent --show-error https://161.97.102.171:8443/review/walkthrough.mp4 -o "$RUNNER_TEMP/dranbleib-public-walkthrough.mp4"
          EXPECTED=$(sha256sum project/assets/walkthrough.mp4 | cut -d' ' -f1)
          ACTUAL=$(sha256sum "$RUNNER_TEMP/dranbleib-public-walkthrough.mp4" | cut -d' ' -f1)
          test "$EXPECTED" = "$ACTUAL"
          echo "PASS public TLS, discovery and exact review video checksum"
      - name: Upload inventory only
        uses: actions/upload-artifact@v4
        with:
          name: dranbleib-contabo-preflight
          path: ${{ runner.temp }}/dranbleib-preflight.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary SSH key
        if: always()
        shell: bash
        run: rm -f /tmp/nyr-web/key
